    <script>(function(){var dark=['onyx','night','graphite','msu','winter','autumn','midnight','ocean','forest','steel','msu-classic'],t='msu';try{t=localStorage.getItem('vmk114-theme')||'msu';}catch(e){}if(t==='light')t='paper';if(t==='dark')t='night';if(t==='auto')t=matchMedia('(prefers-color-scheme: dark)').matches?'midnight':'snow';document.documentElement.dataset.theme=t;document.documentElement.dataset.scheme=dark.indexOf(t)>=0?'dark':'light';var s='glass';try{s=localStorage.getItem('vmk114-style')||s;}catch(e){}if(['atelier','minimal','timeline','cards','glass'].indexOf(s)<0)s='glass';document.documentElement.dataset.style=s;var v=50;try{var q=localStorage.getItem('vmk114-liquid');if(q!==null&&isFinite(+q))v=+q;}catch(e){}var l=Math.min(100,Math.max(0,v))/100,h=Math.max(0,l-.5),r=document.documentElement.style,p=function(n){return Math.round(n)+'%';},x=function(n){return Math.round(n*10)/10+'px';},q2={'--lg':String(l),'--lg2':String(h*2),'--g-fill-p':p(74-34*l),'--g-reading-p':p(88-16*l),'--g-thick-p':p(96-12*l),'--g-past-p':p(88-16*l),'--g-tabs-p':p(90-18*l),'--g-blur-px':x(22-10*l),'--g-blur-thick-px':x(32-10*l)};for(var k in q2)r.setProperty(k,q2[k]);})();</script>
