    <script>(function(){var dark=['onyx','night','graphite','msu','winter','autumn','midnight','ocean','forest','steel','msu-classic'],t='msu';try{t=localStorage.getItem('vmk114-theme')||'msu';}catch(e){}if(t==='light')t='paper';if(t==='dark')t='night';if(t==='auto')t=matchMedia('(prefers-color-scheme: dark)').matches?'midnight':'snow';document.documentElement.dataset.theme=t;document.documentElement.dataset.scheme=dark.indexOf(t)>=0?'dark':'light';var s='glass';try{s=localStorage.getItem('vmk114-style')||s;}catch(e){}if(['atelier','minimal','timeline','cards','glass'].indexOf(s)<0)s='glass';document.documentElement.dataset.style=s;var g='balanced';try{var T=['lite','balanced','full'],c=localStorage.getItem('vmk114-glass-quality'),m=localStorage.getItem('vmk114-glass-auto'),cores=navigator.hardwareConcurrency||8,mem=navigator.deviceMemory||8,guess=(matchMedia('(prefers-reduced-transparency: reduce)').matches||mem<=3||cores<=4)?'lite':matchMedia('(pointer: coarse)').matches?'balanced':'full';g=T.indexOf(c)>=0?c:(T.indexOf(m)>=0&&T.indexOf(m)<T.indexOf(guess)?m:guess);}catch(e){}document.documentElement.dataset.glass=g;var v=50;try{var q=localStorage.getItem('vmk114-liquid');if(q!==null&&isFinite(+q))v=+q;}catch(e){}var l=Math.min(100,Math.max(0,v))/100,h=Math.max(0,l-.5),r=document.documentElement.style,p=function(n){return Math.round(n)+'%';},x=function(n){return Math.round(n*10)/10+'px';},q2={'--lg':String(l),'--lg2':String(h*2),'--c-fill-d':p(82-36*l),'--c-fill-l':p(90-26*l),'--c-past-d':p(68-36*l),'--c-past-l':p(80-26*l),'--c-blur-px':x(24-14*l),'--g-fill-p':p(62-44*l),'--g-blur-px':x(16-12*l),'--g-thick-p':p(90-24*l),'--g-blur-thick-px':x(28-12*l),'--g-tabs-p':p(70-44*l)};for(var k in q2)r.setProperty(k,q2[k]);})();</script>
    <title>Расписание ВМК</title>
    <style>html{background:#090d24;color:#c9cfe6}html[data-scheme=light]{background:#f4f2ec;color:#4a4f5c}.boot{display:grid;place-items:center;min-height:100vh;min-height:100dvh;font:600 15px/1.3 system-ui,sans-serif;letter-spacing:.02em;opacity:.7}</style>
  </head>
  <body>
    <div id="root"><div class="boot">Расписание ВМК</div></div>
    <script>
      // Safety net: if the app's script could not load (an old saved page during an update) or the app has not
      // started in 8 seconds, reload once; the new version is ready by then.
      (function(){var key='vmk-boot-retry',retry=function(){try{if(sessionStorage.getItem(key))return;sessionStorage.setItem(key,'1');}catch(e){return;}location.reload();};
      addEventListener('error',function(e){var t=e.target;if(t&&t.tagName==='SCRIPT')retry();},true);
      setTimeout(function(){if(document.querySelector('#root > .boot'))retry();else try{sessionStorage.removeItem(key);}catch(e){}},8000);})();
    </script>
    <script type="module" src="/main.tsx"></script>
  </body>
