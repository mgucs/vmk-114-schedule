<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#090d24" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ВМК" />
    <meta name="vmk114-shell" content="1" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
    <!-- The app icon the user picked (Оформление → Иконка): read by the phone when the site is added to the home screen. -->
    <script>(function(){try{var k=localStorage.getItem('vmk114-icon');if(!/^(night|day|sunset|emblem|vmk)$/.test(k||''))return;var m=document.querySelector('link[rel=manifest]'),a=document.querySelector('link[rel=apple-touch-icon]');m.href=m.href.replace(/manifest\.webmanifest$/,'manifest-'+k+'.webmanifest');a.href=a.href.replace(/apple-touch-icon\.png$/,'apple-touch-icon-'+k+'.png');}catch(e){}})();</script>
    <script>(function(){var dark=['onyx','night','graphite','msu','winter','autumn','amber','midnight','ocean','forest','steel','msu-classic'],t='msu';try{t=localStorage.getItem('vmk114-theme')||'msu';}catch(e){}if(t==='light')t='paper';if(t==='msu-classic')t='msu';if(t==='dark')t='night';if(t==='auto')t=matchMedia('(prefers-color-scheme: dark)').matches?'midnight':'snow';document.documentElement.dataset.theme=t;document.documentElement.dataset.scheme=dark.indexOf(t)>=0?'dark':'light';var s='glass';try{s=localStorage.getItem('vmk114-style')||s;}catch(e){}if(['atelier','minimal','timeline','cards','glass'].indexOf(s)<0)s='glass';document.documentElement.dataset.style=s;var g='balanced';try{var T=['lite','balanced','full'],c=null,m=localStorage.getItem('vmk114-glass-auto'),cores=navigator.hardwareConcurrency||8,mem=navigator.deviceMemory||8,guess=(matchMedia('(prefers-reduced-transparency: reduce)').matches||mem<=3||cores<=4)?'lite':matchMedia('(pointer: coarse)').matches?'balanced':'full';g=T.indexOf(c)>=0?c:(T.indexOf(m)>=0&&T.indexOf(m)<T.indexOf(guess)?m:guess);}catch(e){}document.documentElement.dataset.glass=g;var v=30;try{var q=localStorage.getItem('vmk114-shade');if(q!==null&&isFinite(+q))v=+q;}catch(e){}document.documentElement.style.setProperty('--shade',String(Math.round(Math.min(100,Math.max(0,v)))/100));})();</script>
    <title>Расписание ВМК</title>
    <style>html{background:#090d24;color:#c9cfe6}html[data-scheme=light]{background:#f4f2ec;color:#4a4f5c}.boot{display:grid;place-items:center;min-height:100vh;min-height:100dvh;font:600 15px/1.3 system-ui,sans-serif;letter-spacing:.02em;opacity:.7}</style>
  </head>
  <body>
    <div id="root"><div class="boot">Расписание ВМК</div></div>
    <script>
      // Safety net: if the app's script could not load (an old saved page during an update) or the app has not
      // started in 8 seconds, reload once; the new version is ready by then.
      (function(){var key='vmk-boot-retry',retry=function(){try{if(sessionStorage.getItem(key))return;sessionStorage.setItem(key,'1');}catch(e){return;}location.reload();};
      addEventListener('error',function(e){var t=e.target;if(t&&t.tagName==='SCRIPT')retry();},true);
      setTimeout(function(){if(document.querySelector('#root > .boot'))retry();else try{sessionStorage.removeItem(key);}catch(e){}},8000);})();
    </script>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
